  <text x="340" y="400" font-family="var(--font-sans)" font-size="18" font-weight="400" fill="#85CEEE" text-anchor="middle" letter-spacing="12" style="fill:rgb(133, 206, 238);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:18px;font-weight:400;text-anchor:middle;dominant-baseline:auto">SERVICES</text>

